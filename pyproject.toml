[project]
name = "lightspeed-stack-pydantic"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35.0",
    "fastapi>=0.139.2",
    "pydantic>=2.13.4",
    "pydantic-ai>=2.13.0",
    "pydantic-ai-harness>=0.7.1",
    "pyyaml>=6.0.3",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
lightspeed-stack = "lightspeed.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lightspeed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
